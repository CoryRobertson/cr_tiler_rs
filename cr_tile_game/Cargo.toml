[package]
name = "cr_tile_game"
version = "0.2.0"
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
macroquad = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
cr_tile_game_common = { path = "../cr_tile_game_common" }
cr_program_settings = { workspace = true}

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12" # for adding program icon to compiled binary

[build-dependencies]
vergen = { version = "9.0", features = ["build"] }
vergen-git2 = { version = "1.0", features = ["build"] }