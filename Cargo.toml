[workspace]
members = ["cr_tile_game_service","cr_tile_game", "cr_tile_game_common"]
resolver = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true

[workspace.dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8.5"
cr_program_settings = "0.1.2"
smol_db_client = "1.5.0-beta.1"